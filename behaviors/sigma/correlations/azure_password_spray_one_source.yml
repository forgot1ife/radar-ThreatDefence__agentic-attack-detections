title: Password Spray Against Many Entra ID Accounts From One Address
id: 58093f32-6164-55bd-a4f8-1578b8706da4
status: experimental
description: |
    Failed sign-ins for 20 or more distinct accounts from one address in 30 minutes. Storm-0940 sprayed 327 accounts at a fixed one-second rhythm. The native KQL and SPL hunts also test the rhythm.
references:
    - https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting
    - https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/
author: ThreatDefence
date: 2026-11-20
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - 71a8ff91-4a7d-58dc-a90f-c3d6c1e676a2
    group-by:
        - IPAddress
    timespan: 30m
    condition:
        gte: 20
        field: UserPrincipalName
falsepositives:
    - Automation and infrastructure-as-code pipelines. Baseline before alerting
level: high

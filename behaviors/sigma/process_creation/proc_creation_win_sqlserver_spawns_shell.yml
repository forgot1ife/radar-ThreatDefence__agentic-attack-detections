title: SQL Server Spawns a Shell Through xp_cmdshell
id: 5a82242d-3e20-5373-9852-830e386a2253
status: experimental
description: |
    Detects sqlservr.exe starting cmd.exe or PowerShell, the result of xp_cmdshell. The SQL Server toolkit seen in
    ARTEX operations enables xp_cmdshell after brute-forcing the sa login, then downloads its loader.
references:
    - https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting
    - https://www.fortinet.com/blog/threat-research/t-sql-being-abused-to-deliver-malware-on-compromised-ms-sql-servers
author: ThreatDefence
date: 2026-11-20
modified: 2026-11-25
tags:
    - attack.execution
    - attack.t1059.003
    - attack.persistence
    - attack.t1505.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith: '\sqlservr.exe'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\certutil.exe'
            - '\bitsadmin.exe'
    condition: selection
falsepositives:
    - Database jobs that use xp_cmdshell by design. Baseline per server
level: high

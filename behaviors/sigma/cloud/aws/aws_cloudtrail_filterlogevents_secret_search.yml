title: CloudWatch Logs Searched for Secrets
id: 510a5a9c-a361-513d-b3f4-52af66cdf912
status: experimental
description: |
    Detects FilterLogEvents calls whose filter pattern searches for passwords or AWS access keys.
    Datadog saw a stolen key search CloudWatch logs with patterns such as ?password ?AKIA, always with a
    limit of 1000.
references:
    - https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting
    - https://securitylabs.datadoghq.com/articles/artex-agentic-attacks-aws-environments/
author: ThreatDefence
date: 2026-11-20
tags:
    - attack.credential-access
    - attack.t1552
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_event:
        eventSource: 'logs.amazonaws.com'
        eventName: 'FilterLogEvents'
    selection_pattern:
        requestParameters.filterPattern|contains:
            - 'password'
            - 'AKIA'
            - 'secret'
            - 'token'
    condition: all of selection_*
falsepositives:
    - Engineers searching logs for leaked secrets during a cleanup
level: medium

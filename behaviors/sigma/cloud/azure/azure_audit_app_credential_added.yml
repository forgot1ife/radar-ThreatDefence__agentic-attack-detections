title: Credential Added to an Entra ID Application
id: 24b5ae56-8f7f-5122-8d83-a5186075fb9c
status: experimental
description: |
    Detects a certificate or secret added to an application or service principal. Storm-0940 used
    compromised applications to add credentials to other applications and assign themselves roles.
    Review who or what made the change: an application changing another application is the case to
    chase.
references:
    - https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting
    - https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/
author: ThreatDefence
date: 2026-11-20
tags:
    - attack.persistence
    - attack.t1098.001
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        properties.message:
            - 'Update application - Certificates and secrets management'
            - 'Add service principal credentials'
    condition: selection
falsepositives:
    - Administrators rotating application secrets
level: medium

id: df5b6ef7-3f87-5a5b-b617-f9262eed71b5
name: Burst of EC2 DryRun permission tests
description: |
  Ten or more EC2 calls with the DryRun flag from one identity in five minutes, the capability check ARTEX agents run with a stolen AWS key.
  Agentic attack detections by ThreatDefence (cross-framework behavior, first written for ARTEX): https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting
severity: Medium
requiredDataConnectors:
  - connectorId: AWS
    dataTypes: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Discovery
relevantTechniques:
  - T1580
query: |
  AWSCloudTrail
  | where EventSource == "ec2.amazonaws.com" and ErrorCode == "Client.DryRunOperation"
  | summarize DryRuns=count(), Actions=dcount(EventName), ActionList=make_set(EventName, 30), FirstSeen=min(TimeGenerated), LastSeen=max(TimeGenerated) by UserIdentityArn, SourceIpAddress, UserAgent, bin(TimeGenerated, 5m)
  | where DryRuns >= 10
version: 1.0.0
kind: Scheduled

title: MCP Kali Server Health Check or Tool Run Under Its API Server
id: 08c2300a-f436-5b70-a8d4-306568e62c47
status: experimental
description: |
    Detects children of MCP Kali Server's API server (python3 server.py): the four lookups its /health route runs every
    time it is called (which nmap, which gobuster, which dirb, which nikto), and the Kali tools its routes start with
    their fixed argument order (sqlmap -u <url> --batch, hydra -t 4, john --wordlist=..., enum4linux -a, msfconsole -q -r).
    The parent file name server.py is common, so the rule also needs a child that only fits MKS.
references:
    - https://github.com/Wh0am123/MCP-Kali-Server/blob/00154c053845b2ec4c3eef49ad09dd9bb2d3b7aa/server.py#L528
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-26
tags:
    - attack.execution
    - attack.t1059
    - attack.discovery
    - attack.t1046
logsource:
    category: process_creation
    product: linux
detection:
    selection_parent:
        ParentCommandLine|contains: 'server.py'
    selection_which:
        CommandLine:
            - 'which nmap'
            - 'which gobuster'
            - 'which dirb'
            - 'which nikto'
    selection_tools:
        CommandLine|startswith:
            - 'sqlmap -u '
            - 'hydra -t 4 '
            - 'john --wordlist='
            - 'enum4linux -a '
            - 'msfconsole -q -r '
            - 'gobuster dir -u '
            - 'nikto -h '
            - 'wpscan --url '
    condition: selection_parent and (selection_which or selection_tools)
falsepositives:
    - Other Python tool servers named server.py that check for the same tools (HexStrike's server is hexstrike_server.py)
    - Authorized tests driven through MCP Kali Server
level: medium

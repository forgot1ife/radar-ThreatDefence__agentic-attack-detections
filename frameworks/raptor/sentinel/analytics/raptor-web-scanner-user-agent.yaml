id: 16716b1d-4637-564a-a0e2-7521bbf0ff67
name: RAPTOR web scanner against a monitored site
description: |
  A web request carried the user agent "RAPTOR Security Scanner (Authorized Testing)", which RAPTOR (gadievron/raptor)
  hard-codes in the HTTP client of its web scanner (packages/web/client.py:199 at ac734352), or one of the fixed probe
  values its checks send. RAPTOR is an autonomous security research framework built on Claude Code that tests web
  applications, validates exploitability and writes proof-of-concept exploits. The user agent says "Authorized Testing":
  check whether a test was agreed.
  Agentic attack detections by ThreatDefence: https://github.com/ThreatDefence/agentic-attack-detections
severity: Medium
requiredDataConnectors:
  - connectorId: CefAma
    dataTypes: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Reconnaissance
relevantTechniques:
  - T1595
query: |
  let ScannerUA = "RAPTOR Security Scanner";
  let UriMarkers = dynamic(["does-not-exist-raptor", "/raptor-clzero-probe", "raptornosuchparam=", "raptorcb=", "__raptor_hits",
      "raptor_pp_probe_value_8472", "evil-raptor-probe.example.com", "state=raptor_probe"]);
  union isfuzzy=true
      (W3CIISLog | extend UA=replace_string(csUserAgent, "+", " "), Url=strcat(csUriStem, "?", csUriQuery)
          | project TimeGenerated, Source="W3CIISLog", IPAddress=cIP, Target=csHost, UA, Url),
      (CommonSecurityLog | project TimeGenerated, Source="CommonSecurityLog", IPAddress=SourceIP, Target=DestinationHostName, UA=RequestClientApplication, Url=RequestURL)
  | where UA startswith ScannerUA or Url has_any (UriMarkers)
  | summarize Events=count(), FirstSeen=min(TimeGenerated), LastSeen=max(TimeGenerated), SampleURLs=make_set(Url, 10),
      UAs=make_set(UA, 5), Sources=make_set(Source) by IPAddress, Target
version: 1.0.0
kind: Scheduled

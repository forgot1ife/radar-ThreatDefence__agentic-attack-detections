title: KaliGPT Installer Download or Web Launcher URL in Proxy Logs
id: d1a45ed6-a96a-5378-b873-9711a7efb1a0
status: experimental
description: |
    Detects a host fetching KaliGPT's installer scripts from raw.githubusercontent.com
    (/SudoHopeX/KaliGPT/refs/heads/hackerx/install.sh and installers/installer.deb.sh, installer.arch.sh,
    installer.termux.sh), cloning its companion search helper from github.com/SudoHopeX/OpenSearchAPI, or opening the
    author's custom GPT at chatgpt.com/g/g-xouSQobsE-kaligpt (kaligpt --web). All HTTPS: the path is visible only with
    TLS inspection.
references:
    - https://github.com/SudoHopeX/KaliGPT
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-26
tags:
    - attack.resource-development
    - attack.t1588.002
    - attack.command-and-control
    - attack.t1105
logsource:
    category: proxy
detection:
    selection_raw_host:
        cs-host: 'raw.githubusercontent.com'
    selection_raw_path:
        # README.md:69, install.sh:55,77,95 at b15b8d48
        c-uri|startswith: '/SudoHopeX/KaliGPT/'
    selection_gh_host:
        cs-host: 'github.com'
    selection_gh_path:
        # installers/installer.deb.sh:77,83
        c-uri|startswith:
            - '/SudoHopeX/KaliGPT.git/'
            - '/SudoHopeX/OpenSearchAPI.git/'
    selection_gpt_host:
        cs-host: 'chatgpt.com'
    selection_gpt_path:
        # agents/utils/web_launcher.json:15
        c-uri|startswith: '/g/g-xouSQobsE-kaligpt'
    condition: (selection_raw_host and selection_raw_path) or (selection_gh_host and selection_gh_path) or (selection_gpt_host and selection_gpt_path)
falsepositives:
    - Someone reading the KaliGPT project or its custom GPT without running it
level: low

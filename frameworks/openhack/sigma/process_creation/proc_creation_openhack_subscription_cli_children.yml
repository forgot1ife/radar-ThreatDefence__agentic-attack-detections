title: Claude Code or Codex CLI Started by OpenHack
id: c04336d7-897c-5138-9198-8280c8a2f615
status: experimental
description: |
    Detects the provider CLI processes OpenHack v2 (openhackai/OpenHack) starts when it reuses a Claude Code or Codex
    subscription login: claude with --safe-mode and the settings {"disableAllHooks":true,"apiKeyHelper":"",
    "forceLoginMethod":"claudeai"} and a system prompt that says "You are a source-review worker inside OpenHack",
    or codex exec whose output schema and instructions file sit in a temporary folder named openhack-subscription-.
    One process starts per model turn, so a scan produces many.
references:
    - https://github.com/openhackai/OpenHack
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-26
tags:
    - attack.resource-development
    - attack.t1588.002
logsource:
    category: process_creation
detection:
    selection_claude:
        CommandLine|contains|all:
            - '--safe-mode'
            - 'disableAllHooks'
            - 'forceLoginMethod'
    selection_codex:
        CommandLine|contains: 'openhack-subscription-'
    selection_prompt:
        CommandLine|contains: 'source-review worker inside OpenHack'
    condition: 1 of selection_*
falsepositives:
    - Developers scanning their own code with OpenHack v2 in subscription mode
    - Another wrapper that starts Claude Code with the same settings
level: low

id: 65ed7a22-c7c8-511d-87b2-26534c8a4d8a
name: Cybermes AI pentest framework on a host
description: |
  A host ran Cybermes, a Hermes Agent based autonomous offensive security framework: the ./cybermes wrapper or the
  Hermes install of the Cybermes Docker image (/opt/hermes-venv/bin/hermes), its Go MCP server cybermes-mcp (started
  by AI clients with npx -y cybermes-mcp@latest and cached in ~/.cybermes/bin/), or files it writes: the cached
  binary and ~/.cybermes/update_check.json, or its auto-loaded skill autonomous-godmode-hunter in the Hermes home.
  Cybermes ships with Hermes approvals off (HERMES_YOLO_MODE=1, approvals.mode: off) and a system prompt that treats
  every target the operator names as authorized. Strings from Zyrexnn/Cybermes at 149b9a66.
  Agentic attack detections by ThreatDefence: https://github.com/ThreatDefence/agentic-attack-detections
severity: Medium
requiredDataConnectors:
  - connectorId: MicrosoftThreatProtection
    dataTypes: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Execution
relevantTechniques:
  - T1059
query: |
  union isfuzzy=true
      (DeviceProcessEvents
          | where ProcessCommandLine matches regex @"\./cybermes\s|/cybermes gateway run|/opt/hermes-venv/bin/hermes|cybermes-mcp@latest|[/\\]\.cybermes[/\\]bin[/\\]cybermes-mcp-v"
              or FileName in~ ("cybermes-mcp", "cybermes-mcp.exe")
          | project TimeGenerated, DeviceName, AccountName, Detail=ProcessCommandLine),
      (DeviceFileEvents
          | where FolderPath matches regex @"[/\\]\.cybermes[/\\](bin[/\\]cybermes-mcp-v|update_check\.json)|[/\\]\.hermes[/\\]skills[/\\]autonomous-godmode-hunter[/\\]"
          | project TimeGenerated, DeviceName, AccountName=InitiatingProcessAccountName, Detail=strcat(FolderPath, " by ", InitiatingProcessFileName))
  | summarize Events=count(), FirstSeen=min(TimeGenerated), Details=make_set(substring(Detail, 0, 300), 10) by DeviceName, AccountName
version: 1.0.0
kind: Scheduled

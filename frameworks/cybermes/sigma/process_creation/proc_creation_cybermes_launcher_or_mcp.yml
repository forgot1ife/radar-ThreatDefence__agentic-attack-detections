title: Cybermes Launcher, MCP Server or Go Tools Started
id: 24f3b9c4-c536-5d53-a9e1-41fd1cdec3f9
status: experimental
description: |
    Detects Cybermes, a Hermes Agent based AI pentest framework (Zyrexnn/Cybermes at 149b9a66), on a host. The ./cybermes
    wrapper (cybermes.bat, cybermes.ps1 on Windows) sets HERMES_HOME to the clone's .hermes folder and execs Hermes; the
    Docker image installs Hermes in /opt/hermes-venv and runs "hermes gateway run" (Telegram control) in container
    cybermes-agent. The Go MCP server cybermes-mcp is started by AI clients through "npx -y cybermes-mcp@latest" and
    cached as ~/.cybermes/bin/cybermes-mcp-v<version>-<os>-<arch>. smart_pipe and search_knowledge are Cybermes' own Go
    command-line tools. The Hermes rules (frameworks/hermes) cover Hermes itself.
references:
    - https://github.com/Zyrexnn/Cybermes
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-26
tags:
    - attack.execution
    - attack.t1059
    - attack.resource-development
    - attack.t1588.002
logsource:
    category: process_creation
detection:
    selection_mcp_image:
        # Dockerfile:88-93, setup.sh:88-92, npm/src/utils/binary.js:44,130
        Image|endswith:
            - '/cybermes-mcp'
            - '\cybermes-mcp.exe'
            - '/smart_pipe'
            - '/search_knowledge'
    selection_mcp_cmd:
        # npm/src/adapters/clients.js:36,42, npm/src/utils/binary.js:44,130
        CommandLine|contains:
            - 'cybermes-mcp@latest'
            - '/.cybermes/bin/cybermes-mcp-v'
            - '\.cybermes\bin\cybermes-mcp-v'
            - 'cybermes-mcp.js'
    selection_launcher:
        # cybermes:1-26, README.md:176, docs/telegram_setup.md:52, Dockerfile:76-80, entrypoint.sh:57
        CommandLine|contains:
            - './cybermes '
            - '/cybermes gateway run'
            - 'cybermes.bat'
            - 'cybermes.ps1'
            - '/opt/hermes-venv/bin/hermes'
    condition: 1 of selection_*
falsepositives:
    - Authorized security testers who run Cybermes
    - Unrelated scripts or binaries named smart_pipe or search_knowledge
level: medium

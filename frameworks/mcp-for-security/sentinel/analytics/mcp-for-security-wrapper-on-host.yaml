id: d1d6426e-4cd0-5e4e-8291-e708b1f87b02
name: MCP for Security tool wrapper started on a host
description: |
  A host started the published MCP for Security image (cyprox/mcp-for-security), or Node.js started one of its tool
  wrappers with the wrapped program as its argument (node <dir>/<tool>-mcp/build/index.js <tool binary>). MCP for
  Security is a set of 23 stdio MCP servers that let an AI assistant run nmap, masscan, nuclei, sqlmap, commix,
  smuggler, ScoutSuite and other tools.
  Agentic attack detections by ThreatDefence: https://github.com/ThreatDefence/agentic-attack-detections
severity: Medium
requiredDataConnectors:
  - connectorId: MicrosoftThreatProtection
    dataTypes: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Discovery
relevantTechniques:
  - T1046
query: |
  let Wrappers = dynamic(["/amass-mcp/build/index.js", "/commix-mcp/build/index.js", "/ffuf-mcp/build/index.js",
      "/gowitness-mcp/build/index.js", "/httpx-mcp/build/index.js", "/katana-mcp/build/index.js", "/masscan-mcp/build/index.js",
      "/nmap-mcp/build/index.js", "/nuclei-mcp/build/index.js", "/scoutsuite-mcp/build/index.js", "/shuffledns-mcp/build/index.js",
      "/smuggler-mcp/build/index.js", "/sqlmap-mcp/build/index.js", "/sslscan-mcp/build/index.js", "/wpscan-mcp/build/index.js"]);
  DeviceProcessEvents
  | where ProcessCommandLine has "cyprox/mcp-for-security"
      or (FileName startswith "node" and ProcessCommandLine has_any (Wrappers)
          and ProcessCommandLine matches regex @"-mcp/build/index\.js\s+\S")
  | summarize Events=count(), FirstSeen=min(TimeGenerated), Details=make_set(substring(ProcessCommandLine, 0, 300), 10) by DeviceName, AccountName
version: 1.0.0
kind: Scheduled

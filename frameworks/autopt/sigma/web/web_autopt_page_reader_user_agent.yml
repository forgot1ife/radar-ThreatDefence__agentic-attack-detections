title: AutoPT Page Reader User Agent in Web Logs
id: 30af23fc-7df5-52c1-aa75-b99496c0c170
status: experimental
description: |
    Detects the user agents of AutoPT's ReadHTML tool: AutoPT/1.0 in the upstream engine, and in evenhu9/AutoPT a
    Chrome string cut off before "(KHTML, like Gecko)", which no browser sends. The truncated string is also used by
    CyberStrikeAI's implant and appears in a Xalgorix prompt example, so it names a family of tools, not AutoPT alone.
references:
    - https://github.com/evenhu9/AutoPT
    - https://github.com/Dizzy-K/AutoPT
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-26
tags:
    - attack.reconnaissance
    - attack.t1595.002
logsource:
    category: webserver
detection:
    selection_upstream:
        cs-user-agent|startswith: 'AutoPT/'
    selection_truncated:
        cs-user-agent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
    condition: 1 of selection_*
falsepositives:
    - Authorized tests with AutoPT
    - Other tools that send the same truncated Chrome string
level: medium

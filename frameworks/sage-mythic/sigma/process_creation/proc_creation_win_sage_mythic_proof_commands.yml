title: Sage (Mythic) Proof Marker or Proof File in a Command Line
id: 2ae9dac8-6526-5252-b96a-097fbfd8004f
status: experimental
description: |
    Detects the default proof markers, proof file names and PFX password prefix that Sage, the AI operator for the Mythic C2
    framework, puts into the commands its tasks run on Windows hosts: the WMI remote command
    "cmd.exe /c echo SAGE_REMOTE_EXEC_PROOF_<host>_<callback> & whoami & hostname & echo ... > C:\Windows\Temp\sage_remote_exec_..."
    (a child of WmiPrvSE.exe), the wmic and scheduled-task fallbacks that read the same file back, the CA key export
    "certutil.exe -f -p SagePfx-v1-... -backupKey C:\Windows\Temp\sage_ca_export_<slug>_backup", certificate enrolment in
    %TEMP%\sage_cert_enroll_<slug>, and the GPO task proof "whoami > C:\Users\Public\sage_gpo_<slug>_whoami.txt".
references:
    - https://github.com/MythicAgents/sage/blob/cbff42f0abc54d3c64b40d3a71cffce01a057023/Payload_Type/sage/ai/langgraph/capabilities.py
    - https://github.com/MythicAgents/sage/blob/cbff42f0abc54d3c64b40d3a71cffce01a057023/Payload_Type/sage/ai/langgraph/mythic_capability_adapter.py
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-26
tags:
    - attack.execution
    - attack.t1047
    - attack.t1059.003
    - attack.credential-access
    - attack.t1649
logsource:
    product: windows
    category: process_creation
detection:
    selection_markers:
        CommandLine|contains:
            - 'SAGE_REMOTE_EXEC_PROOF_'
            - 'SAGE_EP_ADJUST_PROOF'
            - 'SAGE_CA_EXPORT_PROOF'
            - 'SAGE_CERT_ENROLL_PROOF'
            - 'SAGE_CERT_AUTH_PROOF'
            - 'SagePfx-v1-'
    selection_files:
        CommandLine|contains:
            - '\sage_remote_exec'
            - '\sage_ep_adjust'
            - '\sage_ca_export_'
            - '\sage_ca_dpapi_'
            - '\sage_forged_cert_'
            - '\sage_ca_signing_'
            - '\sage_cert_enroll_'
            - '\sage_gpo_'
    condition: 1 of selection_*
falsepositives:
    - Authorized red-team engagements run with Sage in Mythic
level: high

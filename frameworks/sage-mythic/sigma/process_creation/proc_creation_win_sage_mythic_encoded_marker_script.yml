title: Sage (Mythic) Encoded Marker Script Such as Its Defender Change
id: 26ceca59-2a0b-5c2d-9aeb-347eb426ad8f
status: experimental
description: |
    Detects powershell.exe started with an -EncodedCommand whose text begins the way Sage's marker scripts do:
    "$ErrorActionPreference='Continue';$lines=New-Object System.Collections.Generic.List[string];$lines.Add('SAGE_".
    Sage, the AI operator for the Mythic C2 framework, runs its endpoint-protection script this way through the run and shell
    commands and on remote hosts through WMI; by default the script turns off Defender real-time monitoring and adds
    C:\Windows\Temp as an exclusion. The value below is the base64 of that fixed opening in UTF-16LE.
references:
    - https://github.com/MythicAgents/sage/blob/cbff42f0abc54d3c64b40d3a71cffce01a057023/Payload_Type/sage/ai/langgraph/mythic_capability_adapter.py
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-26
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense-impairment
    - attack.t1685
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        CommandLine|contains: 'JABFAHIAcgBvAHIAQQBjAHQAaQBvAG4AUAByAGUAZgBlAHIAZQBuAGMAZQA9ACcAQwBvAG4AdABpAG4AdQBlACcAOwAkAGwAaQBuAGUAcwA9AE4AZQB3AC0ATwBiAGoAZQBjAHQAIABTAHkAcwB0AGUAbQAuAEMAbwBsAGwAZQBjAHQAaQBvAG4AcwAuAEcAZQBuAGUAcgBpAGMALgBMAGkAcwB0AFsAcwB0AHIAaQBuAGcAXQA7ACQAbABpAG4AZQBzAC4AQQBkAGQAKAAnAFMAQQBHAEUA'
    condition: selection
falsepositives:
    - Authorized red-team engagements run with Sage in Mythic
level: high

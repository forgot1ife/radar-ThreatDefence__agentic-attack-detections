title: ARTEMIS Session or Sub-Agent Files Written
id: e87d7b9f-bbf8-5a93-afdd-24877d9ed5d3
status: experimental
description: |
    Detects the files ARTEMIS writes during a run: the supervisor session folder logs/supervisor_session_<unix time>/
    (supervisor.log, supervisor_todo.json, supervisor_heartbeat.json, session_metadata.json, vulnerabilities_found.log,
    session_vulnerabilities.jsonl), the sub-agent exchange files followup_input.json and realtime_context.txt under
    workspaces/<instance id>/, and the autonomous mode backup folder ~/codex-logs-backup/autonomous_session_<time>/
    (supervisor/supervisor.py:22,87-89,140; supervisor/orchestration/orchestrator.py:102,455;
    codex-rs/exec/src/realtime_logger.rs:39; codex-rs/cli/src/main.rs:500-503,629).
references:
    - https://github.com/Stanford-Trinity/ARTEMIS/blob/f309242d2a74493cd41aa3f8b02cec4d3fdd479d/supervisor/orchestration/instance_manager.py#L37-L58
    - https://github.com/Stanford-Trinity/ARTEMIS/blob/f309242d2a74493cd41aa3f8b02cec4d3fdd479d/codex-rs/exec/src/realtime_logger.rs#L39
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-26
tags:
    - attack.execution
    - attack.t1059
logsource:
    category: file_event
detection:
    selection_session:
        TargetFilename|contains: 'supervisor_session_'
        TargetFilename|endswith:
            - 'supervisor_todo.json'
            - 'supervisor_heartbeat.json'
            - 'session_metadata.json'
            - 'vulnerabilities_found.log'
            - 'session_vulnerabilities.jsonl'
    selection_workspace:
        TargetFilename|contains:
            - '/workspaces/'
            - '\workspaces\'
        TargetFilename|endswith:
            - 'followup_input.json'
            - 'realtime_context.txt'
    selection_autonomous:
        TargetFilename|contains:
            - '/codex-logs-backup/autonomous_session_'
            - '\codex-logs-backup\autonomous_session_'
    selection_autonomous_heartbeat:
        TargetFilename|endswith:
            - '/logs/latest_session_heartbeat.json'
            - '\logs\latest_session_heartbeat.json'
    condition: 1 of selection_*
falsepositives:
    - Authorized research or test runs of ARTEMIS
level: medium

title: Hexstrike-redteam BOAZ API in Web Server Logs
id: 3914c63a-0a6b-50b4-ad2b-7cc6348b4375
status: experimental
description: |
    Detects requests to the BOAZ routes of a Hexstrike-redteam server in the logs of a web server or reverse proxy in
    front of it. The server has no authentication, so a request from an unexpected address means someone else can
    build payloads and run commands on it.
references:
    - https://github.com/Yenn503/Hexstrike-redteam
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-26
tags:
    - attack.resource-development
    - attack.t1587.001
logsource:
    category: webserver
detection:
    selection:
        cs-uri-stem|startswith:
            - '/api/boaz/generate-payload'
            - '/api/boaz/list-loaders'
            - '/api/boaz/list-encoders'
            - '/api/boaz/analyze-binary'
            - '/api/boaz/validate-options'
    condition: selection
falsepositives:
    - Authorized tests with Hexstrike-redteam
level: high

title: NeuroSploit Project Store, Vault or C2 Files Written
id: e3bb33ff-a33c-55ff-8592-e7841eac06be
status: experimental
description: |
    Detects the files NeuroSploit writes on the host that runs it: its project store .neurosploit/ (keys.json with model
    API keys, vault/ with the credentials of test accounts it created, c2/ with C2 state, audit log and generated
    payloads), its run folders runs/ns-<unix time>-<target>/ and the Playwright script /tmp/ns_browser_prefetch.js.
references:
    - https://github.com/JoasASantos/NeuroSploit
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-26
tags:
    - attack.resource-development
    - attack.t1588.002
logsource:
    category: file_event
detection:
    selection_store:
        TargetFilename|contains:
            - '/.neurosploit/c2/'
            - '\.neurosploit\c2\'
            - '/.neurosploit/vault/'
            - '\.neurosploit\vault\'
    selection_keys:
        TargetFilename|endswith:
            - '/.neurosploit/keys.json'
            - '\.neurosploit\keys.json'
    selection_tmp:
        TargetFilename: '/tmp/ns_browser_prefetch.js'
    condition: 1 of selection_*
falsepositives:
    - Security teams running NeuroSploit
level: low

title: NeuroSploit Harness on a Host
id: ec1e9ac1-280c-5e4f-a77c-2b8ceb295512
status: experimental
description: |
    Detects NeuroSploit running: the neurosploit binary, its C2 control daemon (neurosploit c2 daemon --port 0 --dir
    <...>/.neurosploit/c2), its Kali and Neo4j containers (neurosploit-kali, neurosploit-neo4j), its Playwright
    pre-fetch script /tmp/ns_browser_prefetch.js, and the coding agent CLIs it starts without approval prompts
    (claude --dangerously-skip-permissions, codex --dangerously-bypass-approvals-and-sandbox) as children of neurosploit.
references:
    - https://github.com/JoasASantos/NeuroSploit
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-26
tags:
    - attack.resource-development
    - attack.t1588.002
    - attack.execution
    - attack.t1059.004
logsource:
    category: process_creation
detection:
    selection_image:
        Image|endswith:
            - '/neurosploit'
            - '\neurosploit.exe'
    selection_cmd:
        CommandLine|contains:
            - 'c2 daemon --port 0 --dir'
            - 'neurosploit-kali'
            - 'neurosploit-neo4j'
            - 'ns_browser_prefetch.js'
            - 'neurosploit-mcp'
    selection_child_parent:
        ParentImage|endswith:
            - '/neurosploit'
            - '\neurosploit.exe'
    selection_child_cmd:
        CommandLine|contains:
            - '--dangerously-skip-permissions'
            - '--dangerously-bypass-approvals-and-sandbox'
    condition: selection_image or selection_cmd or (selection_child_parent and selection_child_cmd)
falsepositives:
    - Security teams running NeuroSploit
level: medium

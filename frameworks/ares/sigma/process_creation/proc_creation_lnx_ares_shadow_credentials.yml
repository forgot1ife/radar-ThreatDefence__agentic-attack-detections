title: Ares Shadow Credentials Passphrase or PFX Name
id: bc2cfc66-dbe4-5251-b1db-ca53ba469dfa
status: experimental
description: |
    Detects the two-stage Shadow Credentials chain of Ares (dreadnode/ares), an LLM-driven Active Directory attack
    agent. Its pywhisker wrapper always writes the exported PFX to <temp>/ares_shadowcred_<millis>-<pid>-<seq>_<account>
    and sets the PFX passphrase to the fixed string ares-shadow-cred; the follow-up certipy auth call opens that file
    with -password ares-shadow-cred (ares-tools/src/acl.rs:262,270,409-418,456-480, privesc/adcs.rs:285-297).
    The rule fires on the attacking host, where the tools run.
references:
    - https://github.com/dreadnode/ares/blob/786b2987bfeb08284b93802c3f533c54738e1e48/ares-tools/src/acl.rs#L249-L270
    - https://github.com/dreadnode/ares/blob/786b2987bfeb08284b93802c3f533c54738e1e48/ares-tools/src/acl.rs#L456-L480
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-26
tags:
    - attack.credential-access
    - attack.t1649
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'ares-shadow-cred'
            - '/ares_shadowcred_'
    condition: selection
falsepositives:
    - Authorized Ares operations
level: high

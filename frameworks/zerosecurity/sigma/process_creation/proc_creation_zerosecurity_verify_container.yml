title: 0security Verification Container Created
id: 88f97405-49c8-548e-b1c4-2f3ef949fdc3
status: experimental
description: |
    Detects 0security's verifier creating the container in which it runs a proof-of-concept step for a finding:
    docker or podman create with the name 0-verify-<12 hex> and the label 0.verify=1, all capabilities dropped
    except DAC_OVERRIDE and FOWNER.
references:
    - https://github.com/0sec-labs/0security
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-26
tags:
    - attack.execution
    - attack.t1059.004
logsource:
    category: process_creation
detection:
    selection:
        CommandLine|contains|all:
            - 'create'
            - '--name 0-verify-'
            - '--label 0.verify=1'
    condition: selection
falsepositives:
    - Developers using 0security's verification on their own code
level: low

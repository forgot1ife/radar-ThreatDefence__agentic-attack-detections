title: Agentic Bug Hunter Toolkit on a Host
id: d98bc6b4-1575-5ada-9278-9b05e0d9145b
status: experimental
description: |
    Detects Agentic Bug Hunter (awarexone/Agentic-Bug-Hunter at 82f4512e) being installed or run: the pip, pipx or uv
    install of agentic-bug-hunter or a clone of its repository, the bughunter and bughunter-agent commands, the stdio
    MCP server (bughunter mcp serve), its recon and scanner scripts, the OOB helper and the Hunt Dashboard server.
    The toolkit is driven by coding assistants (Claude Code, Codex, OpenCode, Gemini/Antigravity) or by its own
    ReAct agent, which runs scanners without a human between steps.
references:
    - https://github.com/awarexone/Agentic-Bug-Hunter
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-26
tags:
    - attack.execution
    - attack.t1059.006
logsource:
    category: process_creation
detection:
    selection_package:
        CommandLine|contains: 'agentic-bug-hunter'
    selection_cli:
        CommandLine|contains:
            - '/bin/bughunter-agent'
            - '/bin/bughunter mcp serve'
            - 'bughunter/engine.py'
            - 'bughunter/agent.py'
    selection_scripts:
        CommandLine|contains:
            - 'bughunter/tools/recon_engine.sh'
            - 'bughunter/tools/vuln_scanner.sh'
            - 'bughunter/tools/bypass_403.sh'
            - 'bughunter/tools/oob_listener.py'
            - 'hunt_dashboard.py serve'
            - 'waf_response_analyzer.py --calibrate'
    condition: 1 of selection_*
falsepositives:
    - Security staff who use Agentic Bug Hunter
level: medium

title: Agentic Bug Hunter Password Spray or Wordlist Crawl Started
id: 4ecfba19-acf5-5c9f-ae7a-81a14eb9756b
status: experimental
description: |
    Detects the credential attack chain of Agentic Bug Hunter (awarexone/Agentic-Bug-Hunter at 82f4512e): its spray
    orchestrator and the Python workers it starts (HTTP form and OAuth password grant), and the cewler crawl of the
    target site with the toolkit's fixed user agent that builds the password list. The orchestrator also hands Microsoft
    365 and Okta sprays to TREVORspray.
references:
    - https://github.com/awarexone/Agentic-Bug-Hunter
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-26
tags:
    - attack.credential-access
    - attack.t1110.003
logsource:
    category: process_creation
detection:
    selection_spray:
        CommandLine|contains:
            - 'spray_orchestrator.sh'
            - '_spray_http_form.py'
            - '_spray_oauth.py'
    selection_crawl:
        CommandLine|contains: 'Intel Mac OS X 10_15_7) Bug-Bounty-Research'
    condition: 1 of selection_*
falsepositives:
    - An agreed credential test by your own red team with Agentic Bug Hunter
level: high

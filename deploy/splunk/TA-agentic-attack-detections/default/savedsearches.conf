description = Detects an image pushed to a container registry under a repository named after an attack agent or a write test: artex-i<issue id>, hermes-h<id>-writecheck, csai-push-probe, xalgorix-pwn, the gh0st/ and fsociety/ namespaces, or names that hold writecheck, push-probe or pwned. Agents that find a registry open to pushes prove it by pushing a small image, and they name it after themselves. Open registries on the internet carry these names by the hundred. A push can be followed by a poisoned copy of one of your own images, so check what else that source pushed. Sigma rule behaviors/sigma/web/web_container_registry_agent_write_test.yml, id 5d869fd4-60e2-5f21-a676-2ddb7b511c66.
search = `aad_web` (http_method="PUT" uri_path="/v2/*" uri_path="*/manifests/*") \
| rex field=uri_path "(?<uri_pathMatch>/(artex[-_](i\\d|probe|push|poc|rce|test|exploit|retest)|ptx-i\\d|hermes-h\\d))" \
| eval uri_pathCondition=if(isnotnull(uri_pathMatch), "true", "false") \
| search uri_path IN ("*writecheck*", "*write-check*", "*push-probe*", "*push-poc*", "*push-test*", "*pwned*", "*hijack-canary*", "*regscan-probe*", "*probe-write-test*", "*/gh0st/*", "*/gh0st-*", "*/fsociety/*", "*/csai-*", "*/cyberstrike-probe*", "*/xalgorix-*") OR uri_pathCondition="true" \
| eval aad_framework="behaviors", aad_rule="Shared behaviors - Attack Agent Write Test on a Container Registry" \
| `aad_entity`
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
cron_schedule = 48 * * * *
enableSched = 1
disabled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.severity = 5
action.summary_index = 1
action.summary_index._name = summary
action.correlationsearch.annotations = {"mitre_attack": ["T1190", "T1525"]}


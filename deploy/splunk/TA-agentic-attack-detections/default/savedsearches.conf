description = Detects outbound or reverse-proxy requests whose user agent names the ARTEX framework or its renamed builds. Outbound hits mean a host on your network is running ARTEX. Sigma rule frameworks/artex/sigma/proxy/proxy_artex_user_agent.yml, id 22f584db-3e7c-523b-ae39-7d0c793a8603.
search = `aad_proxy` (http_user_agent IN ("*artex-readonly/*", "*artex-pentest/*", "*artex-audit/*", "*artex-verify/*", "*artex-spawn/*", "*ARTEX-worker/*", "*artex-enrich/*", "*artex-i21861-canary*", "*artex-agent*", "*artex-judge-*", "*ARTeX-authorized-pentest*", "*Mozilla/5.0 ARTeX*", "*Mozilla/5.0 (ARTEX)*", "*ArtExVerify/*", "*ArtEx/1.0*", "*scopeweaver*", "*spa-api-recon*")) \

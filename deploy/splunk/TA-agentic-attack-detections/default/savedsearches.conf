# Agentic Attack Detections for Splunk. Built by tools/build_splunk.py from https://github.com/ThreatDefence/agentic-attack-detections
# Do not edit here: change the Sigma rule, frameworks/artex/splunk/ or tools/build_splunk.py and rebuild.
# Every search ships disabled. Point the macros in macros.conf at your data, run a search over 30 days to baseline it,
# then enable it. Results go to the summary index for the Agentic Attack Activity dashboard and to Triggered Alerts.
# ATT&CK techniques are in action.correlationsearch.annotations, which Splunk Enterprise Security reads.

[ARTEX - Artifact names in processes and files]
description = artex-probe files, ArtexProbe accounts, the artx5v folder, art18- comments and probe markers.
search = | tstats summariesonly=false count values(Processes.process) as command_lines from datamodel=Endpoint.Processes where (Processes.process="*artex-probe-*" OR Processes.process="*ArtexProbe*" OR Processes.process="*artx5v*" OR Processes.process="*art18-*" OR Processes.process="*ARTEX_WRITE_PROBE*" OR Processes.process="*ARTX_PERSIST_OK*") by Processes.dest Processes.user \
| rename Processes.* as * \
| append [| tstats summariesonly=false count values(Filesystem.file_path) as command_lines from datamodel=Endpoint.Filesystem where (Filesystem.file_name="artex-probe-*" OR Filesystem.file_path="*\\ProgramData\\artx5v\\*" OR Filesystem.file_name IN ("cl1217.jsp","f1219a.jsp","z1219.jsp","graphics-hook-filter64.dll","graphics-hook_config.bin")) by Filesystem.dest Filesystem.user | rename Filesystem.* as *] \
| eval aad_framework="artex", aad_rule="ARTEX - Artifact names in processes and files" \
| `aad_entity`
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 40 * * * *
enableSched = 1
disabled = 1
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 24h
alert.suppress.fields = dest,user
alert.severity = 5
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
action.logevent = 1
action.logevent.param.index = summary
action.logevent.param.sourcetype = aad:result
action.logevent.param.source = ARTEX - Artifact names in processes and files
action.logevent.param.event = search_name="$name$" aad_framework="$result.aad_framework$" aad_entity="$result.aad_entity$" aad_rule="$result.aad_rule$"
action.correlationsearch.annotations = {"mitre_attack": ["T1059", "T1105"]}


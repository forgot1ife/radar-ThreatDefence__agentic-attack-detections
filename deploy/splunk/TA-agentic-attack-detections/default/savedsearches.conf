search = `aad_process` (process IN ("* -m pentestagent*", "*/bin/pentestagent*") OR process IN ("*pentestagent mcp_server*", "*pentestagent tui*", "*pentestagent run *") OR (process="*--mcp-fifo-in*" process="*/pa_mcp_*") OR process IN ("*gh05tcrew/pentestagent*", "*pentestagent-sandbox*")) \
| eval aad_framework="ghostcrew-pentestagent", aad_rule="PentestAgent (GH05TCREW) - CLI, MCP Server, Child Agent or Image on a Host" \
| `aad_entity`
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
cron_schedule = 35 * * * *
enableSched = 1
disabled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.severity = 4
action.summary_index = 1
action.summary_index._name = summary
action.correlationsearch.annotations = {"mitre_attack": ["T1059.006", "T1595.002"]}


description = Detects an attack tool whose parent is an AI agent CLI or the shell Claude Code runs commands through (zsh -c source ~/.claude/shell-snapshots/... on Linux and macOS, the CLAUDE_CODE_SHELL_LAUNCHER_SCRIPT PowerShell launcher on Windows). Auto-approve flags are not part of the rule: staff use them too, and an agent can run an attack tool without one. Qwen Code, Kimi CLI, Codex and opencode start tools through a plain shell, which puts the agent one level above the parent, so this rule only sees them when they start the tool directly; the KQL hunt in behaviors/sentinel/hunting covers the grandparent. The model behind the agent does not matter. Tools written in Python, Ruby or Perl (sqlmap, NetExec, Metasploit, nikto and others) run under their interpreter, so the image is python3, ruby or perl and the tool is the script in the command line; the script selections cover them. A tool started as a module (python3 -m) is not covered. Agents installed with npm or pip run under node or python and are found by their package path in the parent command line. Sigma rule behaviors/sigma/process_creation/proc_creation_lnx_coding_agent_bypass_spawns_attack_tool.yml, id 88fc59b1-a5c1-5229-9753-e11f9a5c4fc0.
